[project]
name = "mnpl-project-data-preprocessing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "huggingface-hub>=1.12.0",
    "pandas>=3.0.2",
    "peft>=0.19.1",
    "protobuf>=7.34.1",
    "pyarrow>=24.0.0",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.12.0",
    "torch==2.6.0",
    "transformers>=5.6.2",
    "wandb>=0.26.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["preprocessing", "constants", "evaluate"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
